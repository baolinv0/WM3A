seed: 42

dataset:
  # No train_manifest: use the explicitly configured fixed_sets below as-is.
  # Train-searching an optimal fixed bracket would make the baseline too strong
  # and defeat the purpose of Kill Test 1 (comparing oracle vs genuinely fixed bracket).
  test_manifest:  data/manifests/sice_test.jsonl
  limit_test:  null
  # images already resized to 512px offline — no runtime resize needed

simulator:
  enabled: false

fusion:
  type: linear_radiance        # pure-NumPy, no OpenCV pyramid; valid for oracle comparison
  params:
    gamma: 2.2
    mu: 5000.0
    sigma: 0.2

heuristic:
  gamma: 2.2
  reliable_low:  0.04
  reliable_high: 0.96
  redundancy_penalty: 0.05

experiment:
  candidate_evs: [-3, -2, -1, 0, 1, 2, 3]
  base_ev: 0.0
  budgets: [1, 2, 3, 4]
  metric: psnr

  # KEY Kill-Test-1 baselines: genuinely fixed brackets (not train-searched).
  fixed_sets:
    2: [-1.0, 0.0]
    3: [-2.0, 0.0, 2.0]        # standard ±2 EV — primary comparison
    4: [-3.0, -1.0, 1.0, 3.0]

  random_repeats: 5
  enumerate_value_tensor: true
  value_tensor_max_subset_size: 2
  bootstrap_repeats: 1000
